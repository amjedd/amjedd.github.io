server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprint-free filenames, so keep HTML uncached and assets short-lived.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?|pdf)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
